- name: Wait for nodes to be ready
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

- name: Install k3s server
  hosts: server
  become: true
  tasks:
    - name: Install k3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - server \
          --cluster-init \
          --node-ip {{ ansible_host }} \
          --tls-san {{ ansible_host }} \
          --write-kubeconfig-mode 644
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node to be Ready
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Ready
        node/{{ inventory_hostname }} --timeout=180s
      changed_when: false

    - name: Read join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Download kubeconfig to this machine
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig"
        flat: true

- name: Install k3s agents
  hosts: agents
  become: true
  tasks:
    - name: Install k3s agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} \
          K3S_URL=https://{{ k3s_server_ip }}:6443 \
          K3S_TOKEN={{ hostvars['k3s-server'].node_token.content | b64decode | trim }} \
          sh -s - agent --node-ip {{ ansible_host }}
      args:
        creates: /usr/local/bin/k3s
      no_log: true

- name: Fix kubeconfig address
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Replace 127.0.0.1 with server IP
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/kubeconfig"
        regexp: '127\.0\.0\.1'
        replace: "{{ hostvars['k3s-server'].ansible_host }}"

- name: Bootstrap Flux
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    github_owner: feliswiediii
  environment:
    KUBECONFIG: "{{ playbook_dir }}/kubeconfig"
    GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"
  tasks:
    - name: Check that GITHUB_TOKEN is set
      ansible.builtin.assert:
        that: lookup('env', 'GITHUB_TOKEN') | length > 0
        fail_msg: "Run first: export GITHUB_TOKEN=$(gh auth token)"

    - name: Flux bootstrap
      ansible.builtin.command: >
        flux bootstrap github
        --owner={{ github_owner }}
        --repository=homelab
        --branch=main
        --path=clusters/home
        --personal