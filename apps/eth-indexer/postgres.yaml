apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: eth-db
  namespace: eth
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: indexer
      owner: indexer
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi