apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-proxy
  labels: { app: vpn-proxy }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vpn-proxy }
  template:
    metadata:
      labels: { app: vpn-proxy }
      annotations:
        config-revision: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: sing-box
          image: ghcr.io/sagernet/sing-box:v1.14.4
          args: ["run", "-c", "/etc/sing-box/config.json"]
          ports:
            - name: proxy
              containerPort: 2080
          readinessProbe:
            tcpSocket: { port: proxy }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: proxy }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: config
              mountPath: /etc/sing-box
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: vpn-proxy-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vpn-proxy
spec:
  selector: { app: vpn-proxy }
  ports:
    - name: proxy
      port: 2080
      targetPort: proxy
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpn-proxy-only-indexer
spec:
  podSelector:
    matchLabels: { app: vpn-proxy }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: eth-indexer }
      ports:
        - port: 2080
