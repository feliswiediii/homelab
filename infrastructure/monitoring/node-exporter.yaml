# Node metrics: CPU, memory, disk, network. Runs on each node.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.60.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # VictoriaMetrics requires prometheus.io/port annotation to scrape the service
    service:
      annotations:
        prometheus.io/port: "9100"
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 64Mi }
