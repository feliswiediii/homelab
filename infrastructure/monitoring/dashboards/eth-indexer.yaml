# Eth indexer dashboard. Grafana sidecar loads ConfigMaps with label grafana_dashboard: "1"
# To update: edit in Grafana, then Share -> Export -> JSON and paste here
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-eth-indexer
  labels:
    grafana_dashboard: "1"
data:
  eth-indexer.json: |
    {
      "uid": "eth-indexer",
      "title": "eth-indexer",
      "tags": [
        "eth",
        "homelab"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": true,
      "panels": [
        {
          "type": "row",
          "title": "Indexer",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Lag, blocks",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Normal is ~5 (safety margin against reorgs). >20 means indexer is falling behind.",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "max(ethidx_lag_blocks)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Last indexed block",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
